	<head>
		<meta charset="utf-8">

		<title>Clocks</title>
		<style>
		*,
		*::before,
		*::after {
			box-sizing: border-box;
		}

		:root {
			color-scheme: light dark;
			font-family:
				-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji',
				'Segoe UI Emoji', 'Segoe UI Symbol';

			@media (prefers-color-scheme: dark) {
				background: hsl(197deg 8% 15%);
			}
		}

		.container {
			font-size: 1rem;
			display: grid;
			grid-template-columns: 1fr 1fr 1fr;
			gap: 2rem;
			margin: 2rem;
		}
		</style>
	</head>
	<body>
		<!-- https://timezonedb.com/ -->
		<!-- https://www.iana.org/time-zones -->
		<main>
			<!-- <h1>Clocks</h1> -->
			<div class="container">

				<tz-clock-analog time="Asia/Shanghai" gloss="Shanghai" hour-cycle="24"></tz-clock-analog>
				<tz-clock-analog
					id="controlled"
					time="2026-09-09T00:00:00.000+00:00[UTC]"
					hour-cycle="24"
					second-hand="false"
				></tz-clock-analog>

				<script type="module">
				const $controlled = document.getElementById('controlled')

				let i = 0
				const MS = 100
				setInterval(() => {
					const ms = i * MS * 60 * 60

					const now = Temporal.Instant.fromEpochMilliseconds(ms)
						.toZonedDateTimeISO('UTC')
						.toString()
					$controlled.setAttribute('time', now)

					i++
				}, MS)
				</script>

				<div>
					<!-- <tz-clock-digital></tz-clock-digital> -->
				</div>
				<!-- <tz-clock-analog time="UTC"></tz-clock-analog> -->
			</div>
		</main>

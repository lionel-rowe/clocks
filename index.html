<!DOCTYPE html>
<html lang="en-US">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Clocks</title>
		<link rel="stylesheet" href="/static/styles.css">
		<template id="tz-clock-digital-template">
			<link rel="stylesheet" href="/static/analog-clock.css">
			<time></time>
		</template>
		<template id="tz-clock-analog-template">
			<link rel="stylesheet" href="/static/analog-clock.css">
			<time class="sr-only"></time>
			<div class="clock" aria-hidden="true">
				<div class="inner"></div>
				<div class="frame-inner">
					<div class="face">
						<div class="glass"></div>
						<div class="ticks minor"></div>
						<div class="ticks major"></div>
						<div class="pin"></div>
						<div class="ring"></div>
						<div class="numbers">
							<span class="number" style="--n: 1"></span>
							<span class="number" style="--n: 2"></span>
							<span class="number" style="--n: 3"></span>
							<span class="number" style="--n: 4"></span>
							<span class="number" style="--n: 5"></span>
							<span class="number" style="--n: 6"></span>
							<span class="number" style="--n: 7"></span>
							<span class="number" style="--n: 8"></span>
							<span class="number" style="--n: 9"></span>
							<span class="number" style="--n: 10"></span>
							<span class="number" style="--n: 11"></span>
							<span class="number" style="--n: 12"></span>
						</div>
						<div class="hands">
							<div class="hand hour">
								<div class="head"></div>
								<div class="center"></div>
								<div class="tail-end"></div>
							</div>
							<div class="hand minute">
								<div class="head"></div>
								<div class="center"></div>
								<div class="tail-end"></div>
							</div>
							<div class="hand second">
								<div class="head"></div>
								<div class="center"></div>
								<div class="tail-end"></div>
							</div>
						</div>
						<div class="gloss"></div>
					</div>
				</div>
			</div>
		</template>
	</head>
	<body>
		<!-- https://timezonedb.com/ -->
		<!-- https://www.iana.org/time-zones -->
		<main>
			<!-- <h1>Clocks</h1> -->
			<div class="container">
				<tz-clock-analog></tz-clock-analog>
				<tz-clock-analog time="Africa/Algiers" gloss="Algiers"></tz-clock-analog>
				<tz-clock-analog time="America/Mexico_City" gloss="Mexico City"></tz-clock-analog>
				<tz-clock-analog time="Asia/Shanghai" gloss="Shanghai"></tz-clock-analog>
				<tz-clock-analog time="Europe/London" gloss="London"></tz-clock-analog>
				<tz-clock-analog time="Europe/Paris" gloss="Paris"></tz-clock-analog>
				<div>
					<tz-clock-digital></tz-clock-digital>
				</div>
				<!-- <tz-clock-analog time="UTC"></tz-clock-analog> -->
			</div>
		</main>
		<script type="module" src="/dist/main.js"></script>
	</body>
</html>

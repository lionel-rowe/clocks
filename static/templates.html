<template id="tz-clock-digital-template">
	<time></time>
</template>
<template id="tz-clock-analog-template">
	<!-- @stylesheet ~/static/analog-clock.css -->
	<time class="sr-only"></time>
	<div class="clock" aria-hidden="true">
		<div class="inner"></div>
		<div class="frame-inner">
			<div class="face">
				<div class="glass"></div>
				<div class="ticks minor"></div>
				<div class="ticks major"></div>
				<div class="pin"></div>
				<div class="ring"></div>
				<div class="numbers">
					<span class="number" style="--n: 1"></span>
					<span class="number" style="--n: 2"></span>
					<span class="number" style="--n: 3"></span>
					<span class="number" style="--n: 4"></span>
					<span class="number" style="--n: 5"></span>
					<span class="number" style="--n: 6"></span>
					<span class="number" style="--n: 7"></span>
					<span class="number" style="--n: 8"></span>
					<span class="number" style="--n: 9"></span>
					<span class="number" style="--n: 10"></span>
					<span class="number" style="--n: 11"></span>
					<span class="number" style="--n: 12"></span>
				</div>
				<div class="hands">
					<div class="hand hour">
						<div class="head"></div>
						<div class="center"></div>
						<div class="tail-end"></div>
					</div>
					<div class="hand minute">
						<div class="head"></div>
						<div class="center"></div>
						<div class="tail-end"></div>
					</div>
					<div class="hand second">
						<div class="head"></div>
						<div class="center"></div>
						<div class="tail-end"></div>
					</div>
				</div>
				<div class="gloss"></div>
			</div>
		</div>
	</div>
</template>
